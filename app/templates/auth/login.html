{% extends "base.html" %}
{% block title %}Iniciar sesión | Marketplace{% endblock %}
{% block main_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="text-center mb-4">
    <div class="auth-icon"><i class="bi bi-house-gear"></i></div>
    <h3 class="fw-bold mt-3">Bienvenido</h3>
    <p class="text-secondary">Ingresa a tu cuenta de Ayacucho Servicios</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Correo electrónico</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="email" placeholder="nombre@correo.com"></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña"></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Mantener sesión iniciada</label></div>
    <button class="btn btn-primary btn-lg w-100">Ingresar <i class="bi bi-arrow-right ms-1"></i></button>
  </form>
  <p class="text-center mt-4 mb-0 small">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate aquí</a></p>
</div>
{% endblock %}
